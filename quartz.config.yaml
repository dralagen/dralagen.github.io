# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Dralagen
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: fr-FR
  baseUrl: dralagen.fr
  ignorePatterns:
    - private
    - templates
    - ".*"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Open Sans
      body: Open Sans
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#f7f5f5"
        lightgray: "#e0e0e0"
        gray: "#aaaaaa"
        darkgray: "#555555"
        dark: "#2b2b2b"
        secondary: "#5c3f35"
        tertiary: "#7d6b5d"
        highlight: rgba(205, 190, 170, 0.15)
        textHighlight: "#e8c18b88"
      darkMode:
        light: "#232120"
        lightgray: "#343331"
        gray: "#6d6a65"
        darkgray: "#c9c0b8"
        dark: "#e6e0d8"
        secondary: "#c19e73"
        tertiary: "#a89985"
        highlight: rgba(185, 170, 145, 0.05)
        textHighlight: "#9e8a5f33"