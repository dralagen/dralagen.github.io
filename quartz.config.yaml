# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Dralagen
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: fr-FR
  baseUrl: dralagen.fr
  ignorePatterns:
    - private
    - templates
    - ".*"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Open Sans
      body: Open Sans
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#f7f5f5"
        lightgray: "#e0e0e0"
        gray: "#aaaaaa"
        darkgray: "#555555"
        dark: "#2b2b2b"
        secondary: "#5c3f35"
        tertiary: "#7d6b5d"
        highlight: rgba(205, 190, 170, 0.15)
        textHighlight: "#e8c18b88"
      darkMode:
        light: "#232120"
        lightgray: "#343331"
        gray: "#6d6a65"
        darkgray: "#c9c0b8"
        dark: "#e6e0d8"
        secondary: "#c19e73"
        tertiary: "#a89985"
        highlight: rgba(185, 170, 145, 0.05)
        textHighlight: "#9e8a5f33"
plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      hidePropertiesView: true
    order: 5
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: rose-pine-dawn
        dark: nord
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/article-title"
    enabled: true
    order: 80
  - source: "@quartz-community/content-meta"
    enabled: true
    order: 90
  - source: "@quartz-community/latex"
    enabled: true
    order: 100
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 110
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 111
  - source: "@quartz-community/roam"
    enabled: false
    order: 112
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      rssLimit: 20
      rssFullHtml: true
      rssSlug: rss
      includeEmptyFiles: false
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
  - source: "@quartz-community/graph"
    enabled: false
  - source: "@quartz-community/backlinks"
    enabled: true
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/spacer"
    enabled: true
    layout:
      position: left
      priority: 15
      display: mobile-only
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: Derniers articles
      limit: 5
      linkToMore: tags/article
      showTags: true
    layout:
      position: afterBody
      priority: 10
      condition: only-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/dralagen
        RSS: https://dralagen.fr/rss.xml
        LinkedIn: https://www.linkedin.com/in/a-garandel/
  - source: "@quartz-community/tag-list"
    enabled: true
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/page-title"
    enabled: true
layout:
  groups:
    toolbar:
      direction: row
      gap: 0.5rem
  byPageType:
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
